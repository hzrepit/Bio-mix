<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты по биологии / Тестҳои биология</title>
<style>
:root {
  --primary: #1a5f2a;
  --primary-dark: #0d3d18;
  --accent: #2e8b57;
  --bg: #f5f9f6;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #555;
  --correct: #28a745;
  --wrong: #dc3545;
  --border: #c8e0d0;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 1rem 1.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-size: 1.35rem;
  font-weight: 600;
}
.lang-switch {
  display: flex;
  gap: 0.4rem;
}
.lang-switch button {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s;
}
.lang-switch button.active {
  background: white;
  color: var(--primary);
  font-weight: 600;
}
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}
.screen { display: none; }
.screen.active { display: block; }
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: var(--shadow);
  margin-bottom: 1.25rem;
  border: 1px solid var(--border);
}
h2 {
  color: var(--primary);
  margin-bottom: 1rem;
  font-size: 1.4rem;
}
.topics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.topic-btn {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1rem;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  font-size: 1rem;
  color: var(--text);
}
.topic-btn:hover, .topic-btn:focus {
  border-color: var(--accent);
  background: #eef8f1;
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.topic-btn .count {
  display: block;
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 0.3rem;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
  align-items: center;
}
.controls label {
  font-size: 0.95rem;
  color: var(--muted);
}
.controls select, .controls input[type="number"] {
  padding: 0.45rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.95rem;
}
button.primary {
  background: var(--primary);
  color: white;
  border: none;
  padding: 0.65rem 1.4rem;
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.2s;
}
button.primary:hover { background: var(--primary-dark); }
button.secondary {
  background: #e8f0eb;
  color: var(--primary);
  border: 1px solid var(--border);
  padding: 0.55rem 1.1rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.95rem;
}
button.secondary:hover { background: #d4e8da; }
.progress-bar {
  height: 8px;
  background: #e0e0e0;
  border-radius: 4px;
  overflow: hidden;
  margin: 0.8rem 0 1.2rem;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
}
.q-num {
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.question-text {
  font-size: 1.15rem;
  font-weight: 500;
  margin-bottom: 1.2rem;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.option {
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  padding: 0.85rem 1rem;
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  background: #fafcfa;
}
.option:hover { border-color: var(--accent); background: #f0f7f2; }
.option.selected { border-color: var(--primary); background: #e8f5eb; }
.option.correct { border-color: var(--correct); background: #e6f9ea; }
.option.wrong { border-color: var(--wrong); background: #fdecea; }
.option input { margin-top: 0.2rem; flex-shrink: 0; }
.option label { cursor: pointer; flex: 1; }
.feedback {
  margin-top: 1.2rem;
  padding: 1rem;
  border-radius: 8px;
  display: none;
}
.feedback.show { display: block; }
.feedback.correct { background: #e6f9ea; border-left: 4px solid var(--correct); }
.feedback.wrong { background: #fdecea; border-left: 4px solid var(--wrong); }
.explanation {
  margin-top: 0.5rem;
  font-size: 0.95rem;
  color: var(--muted);
}
.nav-btns {
  display: flex;
  justify-content: space-between;
  margin-top: 1.5rem;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.score-card {
  text-align: center;
  padding: 2rem 1.5rem;
}
.score-card .big-score {
  font-size: 3rem;
  font-weight: 700;
  color: var(--primary);
  margin: 0.5rem 0;
}
.score-details {
  font-size: 1.1rem;
  color: var(--muted);
  margin-bottom: 1.5rem;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1rem;
  margin: 1.5rem 0;
}
.stat-box {
  background: #f0f7f2;
  padding: 1rem;
  border-radius: 8px;
  text-align: center;
}
.stat-box .num { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
.stat-box .label { font-size: 0.85rem; color: var(--muted); }
footer {
  text-align: center;
  padding: 1.5rem;
  color: var(--muted);
  font-size: 0.85rem;
}
@media (max-width: 600px) {
  header h1 { font-size: 1.1rem; }
  .topics-grid { grid-template-columns: 1fr; }
  .question-text { font-size: 1.05rem; }
}
</style>
</head>
<body>
<header>
  <h1 id="app-title">Тесты по биологии</h1>
  <div class="lang-switch">
    <button id="btn-ru" class="active" onclick="setLang('ru')">Русский</button>
    <button id="btn-tj" onclick="setLang('tj')">Тоҷикӣ</button>
  </div>
</header>

<main>
  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="card">
      <h2 id="home-title">Выберите тему</h2>
      <p id="home-desc" style="color:var(--muted);margin-bottom:1.2rem;">Школьный уровень. Более 700 вопросов. Можно проходить повторно.</p>
      <div class="topics-grid" id="topics-list"></div>
      <div style="margin-top:1.5rem;">
        <button class="primary" id="btn-all" onclick="startQuiz('all')">Все темы (случайные 50)</button>
      </div>
    </div>
  </div>

  <!-- QUIZ SETUP -->
  <div id="screen-setup" class="screen">
    <div class="card">
      <h2 id="setup-title">Настройка теста</h2>
      <div class="controls">
        <label id="lbl-count">Количество вопросов:</label>
        <input type="number" id="q-count" min="5" max="100" value="20">
      </div>
      <div class="controls">
        <button class="primary" id="btn-start" onclick="beginQuiz()">Начать</button>
        <button class="secondary" id="btn-back-setup" onclick="showScreen('home')">Назад</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="card">
      <div class="q-num" id="q-progress"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <div class="feedback" id="q-feedback">
        <div id="fb-result"></div>
        <div class="explanation" id="fb-expl"></div>
      </div>
      <div class="nav-btns">
        <button class="secondary" id="btn-check" onclick="checkAnswer()" style="display:none;">Проверить</button>
        <button class="primary" id="btn-next" onclick="nextQuestion()" style="display:none;">Далее</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="card score-card">
      <h2 id="result-title">Результат</h2>
      <div class="big-score" id="score-percent">0%</div>
      <div class="score-details" id="score-details"></div>
      <div class="stats">
        <div class="stat-box"><div class="num" id="stat-correct">0</div><div class="label" id="lbl-correct">Верно</div></div>
        <div class="stat-box"><div class="num" id="stat-wrong">0</div><div class="label" id="lbl-wrong">Неверно</div></div>
        <div class="stat-box"><div class="num" id="stat-total">0</div><div class="label" id="lbl-total">Всего</div></div>
      </div>
      <div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
        <button class="primary" id="btn-retry" onclick="retryQuiz()">Пройти снова</button>
        <button class="secondary" id="btn-home" onclick="showScreen('home')">К темам</button>
      </div>
    </div>
  </div>
</main>

<footer id="footer-text">Автономный тест • Работает без интернета • Школьная биология</footer>

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n) {
  return shuffle(arr).slice(0, n);
}

function makeOptions(correctRu, correctTj, othersRu, othersTj) {
  const correctIdx = Math.floor(Math.random() * 4);
  const optsRu = [];
  const optsTj = [];
  let wi = 0;
  for (let i = 0; i < 4; i++) {
    if (i === correctIdx) {
      optsRu.push(correctRu);
      optsTj.push(correctTj);
    } else {
      optsRu.push(othersRu[wi] || othersRu[wi % othersRu.length]);
      optsTj.push(othersTj[wi] || othersTj[wi % othersTj.length]);
      wi++;
    }
  }
  return { optsRu, optsTj, correctIdx };
}

function generateQuestionsForTopic(topicKey, count) {
  const factList = facts[topicKey];
  const dist = distractors[topicKey];
  const qs = [];
  const nFacts = factList.length;

  // For each fact create several question variants
  for (let fi = 0; fi < nFacts; fi++) {
    const fact = factList[fi];
    const others = factList.filter((_, i) => i !== fi);
    const othersRu = others.map(f => f.ru).concat(dist.ru);
    const othersTj = others.map(f => f.tj).concat(dist.tj);

    // Type 1: "Какое утверждение верно?"
    {
      const { optsRu, optsTj, correctIdx } = makeOptions(fact.ru, fact.tj, shuffle(othersRu), shuffle(othersTj));
      qs.push({
        topic: topicKey,
        ru: { question: "Какое утверждение верно?", options: optsRu, correct: correctIdx, explanation: "Верно: " + fact.ru },
        tj: { question: "Кадом гуфтор дуруст аст?", options: optsTj, correct: correctIdx, explanation: "Дуруст: " + fact.tj }
      });
    }

    // Type 2: "Выберите правильный факт"
    {
      const { optsRu, optsTj, correctIdx } = makeOptions(fact.ru, fact.tj, shuffle(othersRu), shuffle(othersTj));
      qs.push({
        topic: topicKey,
        ru: { question: "Выберите правильный факт:", options: optsRu, correct: correctIdx, explanation: "Правильный факт: " + fact.ru },
        tj: { question: "Фактҳои дурустро интихоб кунед:", options: optsTj, correct: correctIdx, explanation: "Фактҳои дуруст: " + fact.tj }
      });
    }

    // Type 3: "Что из перечисленного соответствует действительности?"
    {
      const { optsRu, optsTj, correctIdx } = makeOptions(fact.ru, fact.tj, shuffle(othersRu), shuffle(othersTj));
      qs.push({
        topic: topicKey,
        ru: { question: "Что из перечисленного соответствует действительности?", options: optsRu, correct: correctIdx, explanation: "Соответствует: " + fact.ru },
        tj: { question: "Кадом аз зерин ба воқеият мувофиқ аст?", options: optsTj, correct: correctIdx, explanation: "Мувофиқ аст: " + fact.tj }
      });
    }

    // Type 4: True/False style with 4 options
    {
      const { optsRu, optsTj, correctIdx } = makeOptions(
        "Да, это верно: " + fact.ru.slice(0, 80) + (fact.ru.length > 80 ? "…" : ""),
        "Ҳа, дуруст аст: " + fact.tj.slice(0, 80) + (fact.tj.length > 80 ? "…" : ""),
        [
          "Нет, это неверно",
          "Частично верно, но не полностью",
          "Утверждение устарело"
        ].concat(shuffle(othersRu).slice(0, 2)),
        [
          "Не, ин нотӯруст аст",
          "Қисман дуруст, аммо пурра нест",
          "Гуфтор кӯҳна шудааст"
        ].concat(shuffle(othersTj).slice(0, 2))
      );
      qs.push({
        topic: topicKey,
        ru: { question: "Верно ли: «" + fact.ru + "»?", options: optsRu, correct: correctIdx, explanation: "Утверждение верно. " + fact.ru },
        tj: { question: "Оё дуруст аст: «" + fact.tj + "»?", options: optsTj, correct: correctIdx, explanation: "Гуфтор дуруст аст. " + fact.tj }
      });
    }

    // Type 5: "Укажите верное описание"
    {
      const { optsRu, optsTj, correctIdx } = makeOptions(fact.ru, fact.tj, shuffle(othersRu), shuffle(othersTj));
      qs.push({
        topic: topicKey,
        ru: { question: "Укажите верное описание:", options: optsRu, correct: correctIdx, explanation: "Верное описание: " + fact.ru },
        tj: { question: "Тавсифи дурустро нишон диҳед:", options: optsTj, correct: correctIdx, explanation: "Тавсифи дуруст: " + fact.tj }
      });
    }
  }

  // Extra filler if needed (random mixes)
  while (qs.length < count) {
    const fi = Math.floor(Math.random() * nFacts);
    const fact = factList[fi];
    const others = factList.filter((_, i) => i !== fi);
    const othersRu = others.map(f => f.ru).concat(dist.ru);
    const othersTj = others.map(f => f.tj).concat(dist.tj);
    const { optsRu, optsTj, correctIdx } = makeOptions(fact.ru, fact.tj, shuffle(othersRu), shuffle(othersTj));
    qs.push({
      topic: topicKey,
      ru: { question: "Какое из утверждений является верным?", options: optsRu, correct: correctIdx, explanation: "Верно: " + fact.ru },
      tj: { question: "Кадом гуфтор дуруст аст?", options: optsTj, correct: correctIdx, explanation: "Дуруст: " + fact.tj }
    });
  }

  return shuffle(qs).slice(0, Math.max(count, qs.length));
}

// Pre-generate large banks once (5 variants × ~15 facts = 75+, plus extras → 80–90 per topic)
const questionBanks = {};
const TOPIC_KEYS = Object.keys(facts);
TOPIC_KEYS.forEach(tk => {
  // 5 types × number of facts ≈ 75–90, request 90 to fill
  questionBanks[tk] = generateQuestionsForTopic(tk, 90);
});

function renderTopics() {

  list.innerHTML = '';

    const btn = document.createElement('button');
    btn.className = 'topic-btn';
    const name = i18n[currentLang].topics[tk];
    const cnt = questionBanks[tk].length;
    btn.innerHTML = `<strong>${name}</strong><span class="count">${cnt} ${currentLang==='ru'?'вопросов':'савол'}</span>`;
    btn.onclick = () => startQuiz(tk);
    list.appendChild(btn);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function startQuiz(topic) {
  currentTopic = topic;
  showScreen('setup');
  // Default count
  document.getElementById('q-count').value = topic === 'all' ? 50 : 20;
  document.getElementById('q-count').max = topic === 'all' ? 100 : 85;
}

function beginQuiz() {
  let count = parseInt(document.getElementById('q-count').value, 10) || 20;
  count = Math.max(5, Math.min(count, currentTopic === 'all' ? 100 : 85));

  if (currentTopic === 'all') {
    // Mix from all topics
    let pool = [];
    TOPIC_KEYS.forEach(tk => pool = pool.concat(questionBanks[tk]));
    quizQuestions = shuffle(pool).slice(0, count);
  } else {
    quizQuestions = shuffle(questionBanks[currentTopic]).slice(0, count);
  }

  currentIndex = 0;
  score = 0;
  userAnswers = [];
  answered = false;
  showScreen('quiz');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = quizQuestions[currentIndex];
  const data = q[currentLang];
  const total = quizQuestions.length;

  document.getElementById('q-progress').textContent = t('progress').replace('{cur}', currentIndex + 1).replace('{total}', total);
  document.getElementById('progress-fill').style.width = ((currentIndex) / total * 100) + '%';
  document.getElementById('q-text').textContent = data.question || (currentLang==='ru' ? 'Какое утверждение верно?' : 'Кадом гуфтор дуруст аст?');

  const optsDiv = document.getElementById('q-options');
  optsDiv.innerHTML = '';
  data.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.idx = i;
    div.innerHTML = `<input type="radio" name="opt" id="opt${i}" value="${i}"><label for="opt${i}">${opt}</label>`;
    div.onclick = () => {
      if (answered) return;
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      div.classList.add('selected');
      div.querySelector('input').checked = true;
      document.getElementById('btn-check').style.display = 'inline-block';
    };
    optsDiv.appendChild(div);
  });

  document.getElementById('q-feedback').className = 'feedback';
  document.getElementById('q-feedback').classList.remove('show');
  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
}

function checkAnswer() {
  if (answered) return;
  const selected = document.querySelector('input[name="opt"]:checked');
  if (!selected) return;

  answered = true;
  const chosen = parseInt(selected.value, 10);
  const q = quizQuestions[currentIndex];
  const data = q[currentLang];
  const isCorrect = chosen === data.correct;

  if (isCorrect) score++;
  userAnswers.push({chosen, correct: data.correct, isCorrect});

  // Visual
  document.querySelectorAll('.option').forEach((optEl, i) => {
    optEl.style.pointerEvents = 'none';
    if (i === data.correct) optEl.classList.add('correct');
    else if (i === chosen && !isCorrect) optEl.classList.add('wrong');
  });

  const fb = document.getElementById('q-feedback');
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
  document.getElementById('fb-result').textContent = isCorrect ? t('correctAns') : t('wrongAns');
  document.getElementById('fb-expl').textContent = t('explanation') + ' ' + data.explanation;

  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-next').style.display = 'inline-block';
  document.getElementById('progress-fill').style.width = ((currentIndex + 1) / quizQuestions.length * 100) + '%';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  showScreen('result');
  const total = quizQuestions.length;
  const percent = Math.round((score / total) * 100);
  document.getElementById('score-percent').textContent = percent + '%';
  document.getElementById('score-details').textContent = t('scoreText').replace('{c}', score).replace('{t}', total);
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = total - score;
  document.getElementById('stat-total').textContent = total;
}

function retryQuiz() {
  // Re-shuffle same pool size
  beginQuiz();
}

// Init
applyLang();
</script>
</body>
</html>
